<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StockIQ — Markets</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030a0e;font-family:'Rajdhani',sans-serif;color:#ddeef5;display:flex;height:100vh;}
.sidebar{width:220px;min-width:220px;background:#060f14;border-right:1px solid #0d2d3a;display:flex;flex-direction:column;}
.sb-brand{padding:22px 20px 18px;border-bottom:1px solid #0d2d3a;display:flex;align-items:center;gap:10px;}
.sb-logo{width:36px;height:36px;background:linear-gradient(135deg,#00ff88,#00d4ff);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.sb-name{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;background:linear-gradient(90deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sb-sec{padding:18px 14px 6px;font-size:10px;letter-spacing:3px;color:#3a6070;}
.sb-nav{flex:1;padding:0 10px;}
.ni{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:3px;font-size:14px;font-weight:600;color:#7aaabb;transition:all .2s;}
.ni:hover{background:#0a1a22;color:#ddeef5;}
.ni.active{background:linear-gradient(90deg,#00ff8818,#00d4ff0a);color:#00ff88;border-left:2px solid #00ff88;}
.nb{margin-left:auto;background:#ff456020;border:1px solid #ff456040;color:#ff4560;font-size:10px;padding:2px 7px;border-radius:10px;}
.sb-user{padding:16px;border-top:1px solid #0d2d3a;display:flex;align-items:center;gap:10px;}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#00ff88);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#03080e;}
.main{flex:1;display:flex;flex-direction:column;overflow-y:auto;}
.topbar{height:58px;min-height:58px;background:#060f14;border-bottom:1px solid #0d2d3a;display:flex;align-items:center;padding:0 24px;gap:12px;}
.pt{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;letter-spacing:1px;}
.ps{font-size:12px;color:#3a6070;margin-top:1px;}
.body{flex:1;padding:30px;}

/* Market Cards Styling */
.market-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
.m-card { background: #060f14; border: 1px solid #0d2d3a; border-radius: 12px; padding: 24px; transition: transform 0.2s; }
.m-card:hover { transform: translateY(-4px); border-color: #00d4ff50; }
.m-name { font-size: 14px; letter-spacing: 2px; color: #7aaabb; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
.m-price { font-family: 'Orbitron', monospace; font-size: 32px; font-weight: 700; color: #ddeef5; }
.m-change { font-size: 16px; font-weight: 700; margin-top: 6px; }
.up { color: #00ff88; }
.down { color: #ff4560; }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-brand"><div class="sb-logo">📈</div><div class="sb-name">STOCKIQ</div></div>
  <div class="sb-sec">MAIN MENU</div>
  <nav class="sb-nav">
    <div class="ni" onclick="location.href='/dashboard'"><span>⬛</span> Dashboard</div>
    <div class="ni active"><span>📊</span> Markets</div>
    <div class="ni" onclick="location.href='/charts'"><span>🕯️</span> Charts</div>
    <div class="ni" onclick="location.href='/predict'"><span>🤖</span> AI Predict<span class="nb">NEW</span></div>
    <div class="ni" onclick="location.href='/portfolio'"><span>💼</span> Portfolio</div>
    <div class="ni" onclick="location.href='/watchlist'"><span>⭐</span> Watchlist</div>
    <div class="ni" onclick="location.href='/news'"><span>📰</span> News</div>
    <div class="sb-sec" style="padding-left:0;margin-top:8px;">TOOLS</div>
    <div class="ni" onclick="location.href='/screener'"><span>🔍</span> Screener</div>
    <div class="ni" onclick="location.href='/analysis'"><span>📐</span> Analysis</div>
    <div class="ni" onclick="location.href='/settings'"><span>⚙️</span> Settings</div>
    <div class="ni" onclick="location.href='/logout'" style="color:#ff4560"><span>🚪</span> Logout</div>
  </nav>
  <div class="sb-user"><div class="av">MJ</div><div><div style="font-size:13px;font-weight:700;">Manoj JN</div><div style="font-size:10px;color:#3a6070;">◈ PRO TRADER</div></div></div>
</aside>
<div class="main">
  <div class="topbar">
    <div><div class="pt">MARKETS</div><div class="ps">Live Market Data Indices</div></div>
  </div>
  <div class="body">
    <h2 style="font-family: 'Orbitron', monospace; color: var(--cyan);">INDIAN INDICES</h2>
    <div class="market-grid" id="market-data-container">
      <h3 style="color: #3a6070;">Loading live data from server...</h3>
    </div>
  </div>
</div>

<script>
  // Fetch market data from Python backend
  fetch('/api/market')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('market-data-container');
      container.innerHTML = ''; // Clear loading text

      // Loop through data and build cards
      for (const [indexName, stats] of Object.entries(data)) {
        const isUp = stats.change >= 0;
        const colorClass = isUp ? 'up' : 'down';
        const arrow = isUp ? '▲' : '▼';

        container.innerHTML += `
          <div class="m-card">
            <div class="m-name">${indexName}</div>
            <div class="m-price">₹${stats.value.toLocaleString()}</div>
            <div class="m-change ${colorClass}">
              ${arrow} ${Math.abs(stats.change)} (${stats.pct}%)
            </div>
          </div>
        `;
      }
    })
    .catch(err => {
      document.getElementById('market-data-container').innerHTML = 
        '<div style="color:#ff4560;">⚠️ Failed to load market data. Make sure app.py is running.</div>';
    });
</script>
</body>
</html>
